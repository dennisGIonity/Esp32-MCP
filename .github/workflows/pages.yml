# AEDI - IONITY GLOBAL | Publish the Ionity Board Portal (GitHub Pages) + release images | Policy 986 AED
# Settings -> Pages -> Source: GitHub Actions.
name: portal-pages
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Firmware 3 release images, bundled into the portal page
        shell: bash
        working-directory: firmware/esp32-node
        run: |
          . "$IDF_PATH/export.sh" && python release.py
          mkdir -p ../../apps/portal/public/firmware
          cp dist/*.bin dist/manifest.json ../../apps/portal/public/firmware/
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm test -w @ionity/portal && npm run build -w @ionity/portal
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/portal/dist }
      - name: Attach images to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/esp32-node/dist/*.bin
            firmware/esp32-node/dist/manifest.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
