name: docker-image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the fleet server image (context = repo root, as infra/Dockerfile expects)
        run: docker build --file infra/Dockerfile --tag ionity-esp32-mcp:${{ github.sha }} .