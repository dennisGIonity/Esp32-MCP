# AEDI - IONITY GLOBAL | ESP32-MCP CI | Policy 986 AED
name: ci
on:
  push:
    branches: [main, "revamp/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/fleet-host/server/requirements.txt }
      - run: pip install -r services/fleet-host/server/requirements.txt ruff pip-audit
      - name: Lint (ruff) - undefined names, bugbear, async, security
        run: ruff check --select E9,F,B,ASYNC,S,RUF006 --ignore S101,S104,S105,S110,S311,S310,S603,S607,S608,B008 services/fleet-host/server/app services/fleet-host/server/mcp_stdio_proxy.py devices scripts
      - name: Dependency audit
        run: pip-audit -r services/fleet-host/server/requirements.txt
      - name: Fleet host + MCP tests
        working-directory: services/fleet-host/server
        run: python -m pytest -q
        env: { IONITY_MQTT_ENABLED: "false", IONITY_DNS_ENABLED: "false", IONITY_MDNS_ENABLED: "false" }

  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/network-sentinel/requirements.txt pytest pytest-asyncio ruff
      - name: Lint (ruff) - F821 here would have caught the 2026-09 import failure
        run: ruff check --select E9,F services/network-sentinel
      - working-directory: services/network-sentinel
        run: python -m pytest -q

  flasher:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/flasher-legacy } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/flasher-legacy/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11-v1
      - name: Install esp32 core + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install PubSubClient@2.8 ArduinoJson@7.4.3 U8g2@2.36.19
      - name: Build flasher images (no secrets.h)
        run: python3 firmware/legacy-arduino/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: firmware/dist/
          retention-days: 30
