# AEDI - IONITY GLOBAL | ESP32-MCP CI | Policy 986 AED
name: ci
on:
  push:
    branches: [main, "revamp/**", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/fleet-host/server/requirements.txt }
      # mcp: the official MCP SDK, used as the CLIENT in the end-to-end test (server + node + MCP)
      - run: pip install -r services/fleet-host/server/requirements.txt ruff pip-audit pytest-timeout mcp==1.30.0
      - name: Lint (ruff) - undefined names, bugbear, async, security
        run: ruff check --select E9,F,B,ASYNC,S,RUF006 --ignore S101,S104,S105,S110,S311,S310,S603,S607,S608,B008 services/fleet-host/server/app services/fleet-host/server/mcp_stdio_proxy.py devices tools/scripts
      - name: Dependency audit
        run: pip-audit -r services/fleet-host/server/requirements.txt
      - name: Fleet host + MCP tests (incl. E2E - pairing, DNS batch, MCP over Streamable HTTP and stdio)
        working-directory: services/fleet-host/server
        run: python -m pytest -q --timeout 120
        env: { IONITY_MQTT_ENABLED: "false", IONITY_DNS_ENABLED: "false", IONITY_MDNS_ENABLED: "false" }
      - name: Pi agent 2 (EWP/1 node, DNS forwarder, discovery)
        working-directory: devices/pi-agent
        run: python -m pytest -q --timeout 60 tests

  mqtt-e2e:
    name: fleet host <-> real MQTT broker (down at start-up, up, killed, back)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/fleet-host/server/requirements.txt }
      # the lab broker (tools/packaging/broker, amqtt) - the test starts and kills it itself
      - run: pip install -r services/fleet-host/server/requirements.txt pytest-timeout amqtt==0.12.1
      - working-directory: services/fleet-host/server
        run: python -m pytest -q --timeout 180 tests/test_mqtt_bridge_e2e.py
        env: { IONITY_MDNS_ENABLED: "false" }

  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/network-sentinel/requirements.txt pytest pytest-asyncio ruff
      - name: Lint (ruff) - F821 here would have caught the 2026-09 import failure
        run: ruff check --select E9,F services/network-sentinel
      - working-directory: services/network-sentinel
        run: python -m pytest -q

  typescript:
    name: protocol + provisioning + portal
    runs-on: ubuntu-latest
    env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Generated C header + Python modules match the TypeScript contract
        run: npm run check:gen -w @ionity/ewp && npm run check:c -w @ionity/ewp
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @ionity/portal
      - uses: actions/upload-artifact@v4
        with: { name: portal-dist, path: apps/portal/dist/, retention-days: 14 }

  portal-e2e:
    name: portal e2e (Chromium, simulated boards + the real fleet host)
    needs: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/fleet-host/server/requirements.txt }
      - run: pip install -r services/fleet-host/server/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/portal
      - run: npm run build -w @ionity/portal
      - run: npm run e2e -w @ionity/portal
        env: { PYTHON: python }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: portal-e2e, path: apps/portal/e2e/out/, retention-days: 14 }

  firmware-host:
    name: firmware 3 host tests (ASan/UBSan, TSan, fuzz, TS<->C++ interop)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: apt-get update && apt-get install -y --no-install-recommends g++ ninja-build cmake
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: firmware/esp32-node/test/run.sh
        env: { BUILD_DIR: /tmp/fw-build, FUZZ_ITERATIONS: "20000" }

  firmware-build:
    name: firmware 3 release images (S3 + C6, UART + native USB)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: release.py - idf.py builds, image checks, dist/manifest.json for the portal
        shell: bash
        working-directory: firmware/esp32-node
        run: . "$IDF_PATH/export.sh" && python release.py
      - uses: actions/upload-artifact@v4
        with: { name: fw3-release, path: firmware/esp32-node/dist/, retention-days: 30 }

  firmware-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.11-v1
      - name: Install esp32 core + libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install PubSubClient@2.8 ArduinoJson@7.4.3 U8g2@2.36.19
      - name: Build the 2.x Arduino images (no secrets.h)
        run: python3 firmware/legacy-arduino/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-images
          path: firmware/dist/
          retention-days: 30
