# AEDI - IONITY GLOBAL | Mosquitto broker for the ESP32-MCP fleet
# Policy 986 AED | (c) 2018-2026 Antwerp Designs | Ionity (Pty) Ltd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# --- MQTT over TCP (devices) ------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# --- MQTT over WebSockets (browser tooling / MQTT Explorer in a tab) --------
listener 9001 0.0.0.0
protocol websockets

# --- Auth -------------------------------------------------------------------
# DEV: anonymous. Before any real deployment, flip to false and create users:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd ionity_fleet
#   docker compose exec mosquitto mosquitto_passwd    /mosquitto/config/passwd ionity_server
allow_anonymous true
# password_file /mosquitto/config/passwd

# --- Fleet sizing -----------------------------------------------------------
# 1000 nodes at 10s = ~100 msg/s. These headroom values cover ~5000 nodes.
max_connections -1
max_queued_messages 2000
max_inflight_messages 40
message_size_limit 8192

# Devices keepalive at 60s; drop a silent client after ~90s so the LWT fires
# and the fleet server sees it go offline quickly.
persistent_client_expiration 1h
