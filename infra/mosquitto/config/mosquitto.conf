# AEDI - IONITY GLOBAL | Mosquitto broker for the ESP32-MCP fleet
# Policy 986 AED | (c) 2018-2026 Antwerp Designs | Ionity (Pty) Ltd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# --- MQTT over TCP (devices) ------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# --- MQTT over WebSockets (browser tooling / MQTT Explorer in a tab) --------
listener 9001 0.0.0.0
protocol websockets

# --- Auth -------------------------------------------------------------------
# SECURITY (audit 2026-10-02, F-02): with anonymous access any LAN client can
# publish to ionity/broadcast/cmd and drive relays / FAILSAFE / reboots on every
# node. The ACL below confines each board to its own topics and makes the fleet
# server the only command publisher. Steps to enable:
#   1. create users (see infra/mosquitto/config/acl header)
#   2. re-provision boards (flasher: MQTT user ionity_fleet) and Pis
#      (/etc/ionity-agent.conf mqtt_username) ; set IONITY_MQTT_USERNAME/PASSWORD
#   3. flip allow_anonymous to false and uncomment password_file + acl_file
#      TOGETHER (an acl_file with anonymous still on denies anonymous clients
#      every topic, which would also take the fleet offline).
# Left anonymous HERE only because the two lab S3 boards are still enrolled
# without credentials; flipping it first would take the live fleet offline.
allow_anonymous true
# password_file /mosquitto/config/passwd
# acl_file      /mosquitto/config/acl

# --- Fleet sizing -----------------------------------------------------------
# 1000 nodes at 10s = ~100 msg/s. These headroom values cover ~5000 nodes.
max_connections -1
max_queued_messages 2000
max_inflight_messages 40
message_size_limit 8192

# Boards keep alive at 60 s; the protocol itself drops a silent client at
# 1.5 x keepalive (~90 s) and fires its Last Will. This setting is different:
# it expires *persistent sessions* (clean_session=false) that never return.
persistent_client_expiration 1h
