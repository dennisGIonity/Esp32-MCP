# ---------------------------------------------------------------------------
# Arduino IDE 2.x and arduino-cli both read this file, so the board, the
# board options and the port are preselected the moment the sketch opens.
# No more hunting through Tools menus on every unit you flash.
#
# Detected hardware: ESP32-S3 rev v0.2, 16 MB flash, CH340 USB-UART bridge
#   -> FlashSize=16M            use the whole chip
#   -> PartitionScheme=min_spiffs  1.9 MB app x2 OTA slots (default 1.3 MB
#                                  left us at 83% full)
#   -> USB CDC left DISABLED    Serial goes out the CH340, not native USB
# ===========================================================================

default_fqbn: esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=min_spiffs
default_port: COM8
default_protocol: serial

profiles:
  # The board on the bench right now.
  s3_16mb:
    fqbn: esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=min_spiffs
    platforms:
      - platform: esp32:esp32 (3.3.11)
    libraries:
      - PubSubClient (2.8)
      - ArduinoJson (7.4.3)

  # Cheap high-volume fleet nodes.
  esp32_classic:
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (3.3.11)
    libraries:
      - PubSubClient (2.8)
      - ArduinoJson (7.4.3)

  esp32c3:
    fqbn: esp32:esp32:esp32c3
    platforms:
      - platform: esp32:esp32 (3.3.11)
    libraries:
      - PubSubClient (2.8)
      - ArduinoJson (7.4.3)
