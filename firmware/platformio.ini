; ---------------------------------------------------------------------------
; ONE firmware source: this builds the Arduino sketch in
; ../firmware-arduino/Esp32_MCP_Node - the same code the Arduino IDE and
; scripts/add_device.ps1 flash. (The old PlatformIO-only v1.0.0 source had a
; hard-coded server IP and no mDNS / dns_probe / OLED; it was retired
; 2026-09-28 and lives in git history.)
;
;   cd firmware
;   copy ..\firmware-arduino\Esp32_MCP_Node\secrets.h.example ..\firmware-arduino\Esp32_MCP_Node\secrets.h
;   pio run -e esp32s3 -t upload
; ===========================================================================

[platformio]
default_envs = esp32s3
src_dir = ../firmware-arduino/Esp32_MCP_Node

[env]
; pioarduino = Arduino-ESP32 core 3.x (the sketch targets core 3.3, like the IDE)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
    olikraus/U8g2@^2.35
build_flags =
    -DCORE_DEBUG_LEVEL=2

; ESP32-S3 (16 MB, the lab boards)
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32 (WROOM-32) - cheap high-volume nodes
[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv

; ESP32-C3 - lowest cost / lowest power nodes
[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; OTA after the first USB flash:  pio run -e esp32s3_ota -t upload --upload-port <board-ip>
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
