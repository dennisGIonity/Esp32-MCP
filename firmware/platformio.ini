[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
    https://github.com/marian-craciunescu/ESP32Ping.git

build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DMQTT_MAX_PACKET_SIZE=1024

; ---------------------------------------------------------------------------
; ESP32-S3 - primary fleet target (matches RouterProject sentinel hardware)
; ---------------------------------------------------------------------------
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Classic ESP32 (WROOM-32) - cheap high-volume fleet nodes
; ---------------------------------------------------------------------------
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32DEV=1

; ---------------------------------------------------------------------------
; ESP32-C3 - lowest cost / lowest power fleet nodes
; ---------------------------------------------------------------------------
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3=1

; ---------------------------------------------------------------------------
; OTA upload env - set --upload-port to the device IP after first USB flash
; pio run -e esp32s3_ota -t upload --upload-port 192.168.2.57
; ---------------------------------------------------------------------------
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
