; ---------------------------------------------------------------------------
; The same ESP-IDF project idf.py builds (CMakeLists.txt, components/, main/):
; PlatformIO's "espidf" framework runs that CMake build. src_dir = main makes
; main/ the application component instead of PlatformIO's default src/.
;
;   cd firmware/esp32-node
;   pio run -e s3_usb -t upload          ; ESP32-S3, console on the native USB port
;   pio run -e s3_uart -t upload         ; ESP32-S3, console on the CH340/CP210x port
;   pio device monitor -e s3_usb
;
; One env per board/console pair; the console choice is an sdkconfig fragment
; layered on sdkconfig.defaults (+ sdkconfig.defaults.<target>), exactly as
; release.py does. Settings stay in NVS across uploads (same partition table
; as fw 2.x), so a board keeps its Wi-Fi.
; ===========================================================================

[platformio]
src_dir = main
default_envs = s3_usb

[env]
; pioarduino: ESP-IDF 5.5 for PlatformIO (the same platform ../platformio.ini uses).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:s3_usb]
board = esp32-s3-devkitc-1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.usb"

[env:s3_uart]
board = esp32-s3-devkitc-1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.uart"

[env:c6_usb]
board = esp32-c6-devkitc-1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.usb"

[env:c6_uart]
board = esp32-c6-devkitc-1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.uart"
